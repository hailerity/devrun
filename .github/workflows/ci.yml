name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every go-version below names a patch, not a minor, and has to. The
# advisories this repo moved for are fixed in 1.26.9, while "1.26" resolves to
# 1.26.8 — a Vulncheck failure that reads as a code problem and is not one.
#
# go.mod's toolchain line cannot cover for it here: actions/setup-go exports
# GOTOOLCHAIN=local, which overrides a workflow env and makes the go command
# ignore that line, so CI builds with exactly what setup-go installed. The
# version is therefore pinned where setup-go reads it, and bumping it means
# editing each one.

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.26.9"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Integration test
        run: go test -tags integration ./internal/integration/... -v -count=1 -timeout 120s

  tidy:
    name: Mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.9"
          cache: true

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.9"
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: "v2.11.4"

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.9"
          cache: true

      # Pinned, like golangci-lint above, so a tool release cannot break this
      # job on its own. Bump it together with go-version: v1.8.0 requires Go
      # 1.26, which is why the pin sat at v1.7.0 while CI ran 1.25.
      #
      # The vulnerability database is fetched live, so a pinned tool still
      # sees newly published vulnerabilities — this job can start failing on a
      # commit that changed nothing, and when it does, the fix is usually a
      # newer Go rather than anything in this repository.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
