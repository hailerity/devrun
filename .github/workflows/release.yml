name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# The go-version below names a patch for the reason ci.yml gives, and it
# matters more here than there: setup-go's GOTOOLCHAIN=local means the
# published binaries carry exactly this standard library, so a minor that
# resolved to an older patch would ship the vulnerabilities rather than just
# fail a check.

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # GoReleaser needs full history for changelog

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.9"
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
